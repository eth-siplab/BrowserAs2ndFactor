name: Release extensions

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chrome/package-lock.json
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const t=process.env.RELEASE_TAG; if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(t) || t.slice(1).split(".").some(n => Number(n)>65535) || t === "v0.0.0") throw Error("Use a tag such as v0.3.0 (components <= 65535)");'
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: chrome
      - run: npm run build
        working-directory: chrome
      - name: Package browser extensions
        run: python3 scripts/package-release.py "$VERSION" release
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip --verify-tag --generate-notes --notes 'Chrome: unpacked extension ZIP. Firefox: unsigned extension source ZIP, for temporary loading or signing through Mozilla. See the repository README for installation details.'
          fi
